<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f8fe;--card:#fff;--ink:#0f1f3d;--mut:#5a6b88;--line:#d9e3f2;--acc:#1d5fd1;--accbg:#e3edfc;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1426;--card:#122039;--ink:#eef3fc;--mut:#98a9c8;--line:#233456;--acc:#6aa5ff;--accbg:#1a2f57;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1426;--card:#122039;--ink:#eef3fc;--mut:#98a9c8;--line:#233456;--acc:#6aa5ff;--accbg:#1a2f57;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:40px 20px 110px}
h1{font:600 clamp(2rem,6vw,3.2rem)/1.1 Georgia,"Times New Roman",serif;margin:0 0 6px}
.role{color:var(--acc);font-weight:600;margin:0 0 14px}
.bio{max-width:640px;color:var(--mut);margin:0 0 16px;white-space:pre-line}
.contacts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:34px}
a.pill,.pill{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:99px;color:var(--ink);text-decoration:none;font-size:.9rem;background:var(--card);cursor:pointer}
a.pill:hover{border-color:var(--acc);color:var(--acc)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.filters .pill.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--mut)}
.badge{background:var(--accbg);color:var(--acc);padding:2px 10px;border-radius:99px;font-weight:600}
.card h3{margin:0;font:600 1.2rem/1.25 Georgia,serif}
.card p{margin:0;color:var(--mut);font-size:.95rem;white-space:pre-line}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{font-size:.75rem;border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--mut)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.thumbs img{width:100%;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.files{display:flex;flex-direction:column;gap:6px}
.files a{font-size:.88rem;color:var(--acc);text-decoration:none;word-break:break-word}.files a:hover{text-decoration:underline}
.empty{color:var(--mut);padding:30px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:var(--card);border-top:1px solid var(--line);z-index:5}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.danger{color:#c0392b}
.row{display:flex;gap:8px;margin-top:auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px}
.modal{background:var(--card);border-radius:14px;padding:22px;width:100%;max-width:560px;margin:auto}
.modal h2{margin:0 0 14px;font:600 1.3rem Georgia,serif}
label{display:block;font-size:.82rem;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.fl{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;padding:4px 0}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.qr{width:220px;margin:12px auto;background:#fff;padding:6px;border-radius:8px}.qr svg{width:100%;height:auto;display:block}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:20;font-size:.9rem}
.sec{font:600 1.5rem Georgia,serif;margin:0 0 14px}.cvbox{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;padding:16px 18px;margin-bottom:36px}a.pill.pri{background:var(--acc);color:#fff;border-color:var(--acc)}a.pill.pri:hover{color:#fff;opacity:.9}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:40px}.map{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}.map img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;cursor:zoom-in;background:var(--accbg)}.map .mb{padding:12px 14px;display:flex;flex-direction:column;gap:8px}.map h3{margin:0;font:600 1.05rem Georgia,serif}.map p{margin:0;color:var(--mut);font-size:.88rem;white-space:pre-line}.lb{position:fixed;inset:0;background:rgba(5,12,28,.94);z-index:30;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}.lb img{position:absolute;left:0;top:0;max-width:none;max-height:none;transform-origin:0 0;cursor:grab;-webkit-user-drag:none}.lb .zb{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:8px;z-index:2}.lb .zb button{width:42px;height:42px;font-size:1.3rem;line-height:1;padding:0;border-radius:99px;background:rgba(255,255,255,.16);color:#fff;border-color:transparent}.lb .zh{position:absolute;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;opacity:.7;font-size:.8rem;pointer-events:none;padding:0 12px}
</style></head>

DdJckXy9H5Gsyfuwdk9BrqLZLq/view?usp=drive_link"}],"files":[]},{"id":"p3","title":"Stage de fin d'étude - Cartographie des palmiers à huile au Mexique","year":"2026","desc":"Durant ce stage effectué à l'UMR TETIS, ma mission consistait à développer une méthode de cartographie des palmiers à huile dans les Etats de Chiapas, Campeche, Tabasco et Veracruz au Mexique. Nous avons utilisé des modèles de Machine Learning et de Deep Learning pour réaliser des prédictions sur ces territoires. La seconde étape a ensuite consisté à établir la maturité de ces plantations.","tags":["Modèle IA","RandomForest","U-net","Python","QGIS"],"links":[{"label":"","url":"https://drive.google.com/file/d/1HPZ91T1y0JE52FUyFscYJYHm_J4ycZjb/view?usp=drive_link"}],"files":[]}],"cv":{"name":"GOURRE_LUKA.pdf","id":"876bd0120bffac467f38c879c15a4353","type":"application/pdf"},"maps":[{"id":"m1792675179087","title":"Reproduction manuelle carte IGN","desc":"","file":{"name":"Luka_GOURRE_Palavas.jpg","id":"2ef6b067f33f04809136291d27e38a18","type":"image/jpeg"}},{"id":"m1792675112538","title":"Démographie Guyane","desc":"","file":{"name":"svg_demographie_guyane.png","id":"eae7c8abe8640872c380799b2e3b5d6c","type":"image/png"}},{"id":"m1792675094946","title":"Etablissements scolaires en Guyane","desc":"","file":{"name":"ecole_guyane.png","id":"eeb4fa66f1038b034eda5ea9f2ffa93d","type":"image/png"}},{"id":"m1792675063582","title":"Tendances météorologiques en France","desc":"","file":{"name":"GOURRE_Luka_Carte_meteorologique.jpg","id":"e346789d793c59bbca3ddc9f209bf510","type":"image/jpeg"}}]}</script>

<script>
const S=JSON.parse(document.getElementById('data').textContent);S.maps=S.maps||[];
const CATS=['Master 1','Master 2','Stage de fin d’études','Autres'];
let canEdit=false,filter='Tous',artifact=null,assets=null,dl=null,cur=null,curM=null;
const $=(s,r=document)=>r.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okUrl=u=>/^https?:\/\//i.test(u);
const isImg=f=>/^image\//.test(f.type||'');
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function upErr(e){toast(e&&e.code==='unsupported_type'?'Format non accepté. Sont acceptés : images, PDF, vidéo, CSV, JSON, texte, Markdown. Pour un ZIP ou un DOCX, ajoutez plutôt un lien (Drive, GitHub) ou exportez en PDF.':'Échec : '+(e&&e.message||e))}
function build(){const c=document.documentElement.cloneNode(true);$('#app',c).innerHTML='';$('#data',c).textContent=JSON.stringify(S).replace(/</g,'\\u003c');$('title',c).textContent=S.profile.name||'Portfolio';return '<!doctype html>\n'+c.outerHTML}
async function save(){if(!artifact)return toast('Édition indisponible ici.');try{await artifact.publish(build())}catch(e){toast(e&&e.code==='conflict'?'Une autre version a été publiée, rechargement…':'Échec de l’enregistrement : '+(e&&e.message||e))}}
function render(){
  const p=S.profile,list=S.projects,cv=S.cv;
  const mapsHtml=(S.maps.length||canEdit)?`<h2 class="sec" style="margin-top:44px">Mes cartes</h2><div class="maps">${S.maps.map(mapCard).join('')||'<div class="empty" style="grid-column:1/-1">Aucune carte pour le moment : utilisez « + Carte » en bas.</div>'}</div>`:'';
  const cvHtml=cv?`<h2 class="sec">Mon CV</h2><div class="cvbox"><span>📄 ${esc(cv.name)}</span><span style="display:flex;gap:8px;flex-wrap:wrap"><a class="pill pri" href="/_blob/${esc(cv.id)}" target="_blank" rel="noopener">Voir / télécharger le CV</a>${canEdit?`<button data-a="rmcv">Retirer</button>`:''}</span></div>`:(canEdit?`<h2 class="sec">Mon CV</h2><div class="cvbox"><span style="color:var(--mut)">Aucun CV pour le moment : utilisez le bouton « CV » en bas pour déposer un PDF.</span></div>`:'');


  const contacts=[p.email&&`<a class="pill" href="mailto:${esc(p.email)}">✉ ${esc(p.email)}</a>`,okUrl(p.linkedin)&&`<a class="pill" href="${esc(p.linkedin)}" target="_blank" rel="noopener">LinkedIn</a>`,okUrl(p.github)&&`<a class="pill" href="${esc(p.github)}" target="_blank" rel="noopener">GitHub</a>`].filter(Boolean).join('');
  $('#app').innerHTML=`<div class="wrap"><h1>${esc(p.name)}</h1><p class="role">${esc(p.title)}</p><p class="bio">${esc(p.bio)}</p><div class="contacts">${contacts}</div>
  ${cvHtml}<h2 class="sec">Projets &amp; réalisations</h2>
  <div class="grid">${list.map(card).join('')||'<div class="empty">Aucun projet pour le moment.</div>'}</div>${mapsHtml}</div>
  ${canEdit?`<div class="bar"><button class="pri" data-a="new">+ Projet</button><button data-a="map">+ Carte</button><button data-a="profile">Profil</button><button data-a="cv">CV</button><button data-a="qr">QR code &amp; lien</button></div>`:''}`;
}
function openZoom(id){
  const l=document.createElement('div');l.className='lb';
  l.innerHTML=`<div class="zb"><button type="button" aria-label="Zoom avant">+</button><button type="button" aria-label="Zoom arrière">−</button><button type="button" aria-label="Fermer">✕</button></div><img alt="" draggable="false" src="/_blob/${esc(id)}"><div class="zh">Molette ou pincement pour zoomer · glisser pour déplacer · double-clic pour agrandir</div>`;
  $('#app').appendChild(l);
  const im=$('img',l),[bp,bm,bx]=l.querySelectorAll('.zb button');
  let s=1,s0=1,x=0,y=0;const P=new Map();
  const W=()=>l.clientWidth,H=()=>l.clientHeight;
  const ap=()=>{im.style.transform=`translate(${x}px,${y}px) scale(${s})`};
  const fit=()=>{const nw=im.naturalWidth,nh=im.naturalHeight;if(!nw)return;s0=s=Math.min(W()/nw,H()/nh);x=(W()-nw*s)/2;y=(H()-nh*s)/2;im.style.width=nw+'px';im.style.height=nh+'px';ap()};
  const zoom=(f,cx,cy)=>{const ns=Math.min(Math.max(s*f,s0),Math.max(s0*8,4));x=cx-(cx-x)*ns/s;y=cy-(cy-y)*ns/s;s=ns;if(s<=s0*1.001)fit();else ap()};
  im.onload=fit;if(im.complete)fit();
  l.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(-e.deltaY*0.002),e.clientX,e.clientY)},{passive:false});
  l.addEventListener('pointerdown',e=>{if(e.target.closest('.zb'))return;try{l.setPointerCapture(e.pointerId)}catch(_){}P.set(e.pointerId,{x:e.clientX,y:e.clientY})});
  l.addEventListener('pointermove',e=>{const p=P.get(e.pointerId);if(!p)return;
    if(P.size===2){const [a,b]=[...P.values()];const d0=Math.hypot(a.x-b.x,a.y-b.y);p.x=e.clientX;p.y=e.clientY;const [c,d]=[...P.values()];const d1=Math.hypot(c.x-d.x,c.y-d.y);if(d0>0)zoom(d1/d0,(c.x+d.x)/2,(c.y+d.y)/2)}
    else{x+=e.clientX-p.x;y+=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;ap()}});
  const up=e=>{P.delete(e.pointerId);if(s<=s0*1.001)fit()};
  l.addEventListener('pointerup',up);l.addEventListener('pointercancel',up);
  l.addEventListener('dblclick',e=>{if(e.target.closest('.zb'))return;if(s>s0*1.5)fit();else zoom(3,e.clientX,e.clientY)});
  bp.onclick=()=>zoom(1.6,W()/2,H()/2);bm.onclick=()=>zoom(1/1.6,W()/2,H()/2);
  const close=()=>{l.remove();document.removeEventListener('keydown',kd)};
  const kd=e=>{if(e.key==='Escape')close()};
  document.addEventListener('keydown',kd);bx.onclick=close;
}
function mapCard(m){const f=m.file||{},img=isImg(f);return `<div class="map">${img?`<img loading="lazy" alt="${esc(m.title)}" src="/_blob/${esc(f.id)}" data-a="zoom" data-id="${esc(f.id)}">`:''}<div class="mb"><h3>${esc(m.title)}</h3>${m.desc?`<p>${esc(m.desc)}</p>`:''}${img?'':`<a class="pill pri" href="/_blob/${esc(f.id)}" target="_blank" rel="noopener">📄 Ouvrir la carte</a>`}${canEdit?`<div class="row"><button data-a="editmap" data-id="${esc(m.id)}">Modifier</button><button class="danger" data-a="delmap" data-id="${esc(m.id)}">Supprimer</button></div>`:''}</div></div>`}
function openMap(id){const x=S.maps.find(m=>m.id===id);curM=JSON.parse(JSON.stringify(x||{id:'m'+Date.now(),title:'',desc:'',file:null}));
modal(`<h2>${x?'Modifier':'Nouvelle'} carte</h2><label>Titre</label><input id="m-title" value="${esc(curM.title)}"><label>Description (échelle, source des données, outil, projection…)</label><textarea id="m-desc">${esc(curM.desc)}</textarea><label>Fichier de la carte (PNG, JPG, SVG ou PDF)</label><div id="m-file" class="fl"></div>${assets?'<input id="m-up" type="file" accept="image/*,.pdf,application/pdf">':'<div style="color:var(--mut);font-size:.85rem">Dépôt indisponible dans cette vue.</div>'}<div class="acts"><button data-a="close">Annuler</button><button class="pri" data-a="saveM">Enregistrer</button></div>`);
const sf=()=>{$('#m-file').textContent=curM.file?'✔ '+curM.file.name:'Aucun fichier'};sf();
const up=$('#m-up');if(up)up.onchange=async()=>{const f=up.files[0];if(!f)return;try{toast('Envoi…');const r=await assets.upload(f);curM.file={name:f.name,id:r.id,type:r.contentType||f.type};sf()}catch(e){upErr(e)}}}
function card(x){
  const imgs=x.files.filter(isImg),oth=x.files.filter(f=>!isImg(f)),links=x.links.filter(l=>okUrl(l.url));
  return `<div class="card"><div class="meta"><span>${esc(x.year)}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p>
  ${x.tags.length?`<div class="tags">${x.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}
  ${imgs.length?`<div class="thumbs">${imgs.map(f=>`<a href="/_blob/${esc(f.id)}" target="_blank" rel="noopener"><img loading="lazy" alt="${esc(f.name)}" src="/_blob/${esc(f.id)}"></a>`).join('')}</div>`:''}
  ${oth.length||links.length?`<div class="files">${oth.map(f=>`<a href="/_blob/${esc(f.id)}" target="_blank" rel="noopener">📎 ${esc(f.name)}</a>`).join('')}${links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">🔗 ${esc(l.label||l.url)}</a>`).join('')}</div>`:''}
  ${canEdit?`<div class="row"><button data-a="edit" data-id="${esc(x.id)}">Modifier</button><button class="danger" data-a="del" data-id="${esc(x.id)}">Supprimer</button></div>`:''}</div>`;
}
function modal(html){closeM();const o=document.createElement('div');o.className='ov';o.id='ov';o.innerHTML=`<div class="modal">${html}</div>`;$('#app').appendChild(o)}
function closeM(){const o=$('#ov');if(o)o.remove()}
function fileList(){const b=$('#fl');if(!b)return;b.innerHTML=cur.files.map((f,i)=>`<div class="fl"><span>${isImg(f)?'🖼':'📎'} ${esc(f.name)}</span><button class="danger" data-a="rmf" data-i="${i}">Retirer</button></div>`).join('')||'<div class="fl" style="color:var(--mut)">Aucun fichier</div>'}
function openProject(id){
  const x=S.projects.find(p=>p.id===id);
  cur=JSON.parse(JSON.stringify(x||{id:'p'+Date.now(),title:'',year:String(new Date().getFullYear()),desc:'',tags:[],links:[],files:[]}));
  modal(`<h2>${x?'Modifier':'Nouveau'} projet</h2>
  <label>Titre</label><input id="f-title" value="${esc(cur.title)}">
  <label>Année</label><input id="f-year" value="${esc(cur.year)}">
  <label>Description</label><textarea id="f-desc">${esc(cur.desc)}</textarea>
  <label>Mots-clés (séparés par des virgules)</label><input id="f-tags" value="${esc(cur.tags.join(', '))}">
  <label>Liens (un par ligne : « Libellé | https://… ») : idéal pour un ZIP hébergé sur Drive ou GitHub</label><textarea id="f-links">${esc(cur.links.map(l=>l.label?l.label+' | '+l.url:l.url).join('\n'))}</textarea>
  <label>Fichiers (images, PDF, CSV, texte, vidéo… ; les ZIP ne sont pas acceptés)</label><div id="fl"></div>
  ${assets?`<input id="f-up" type="file" multiple>`:'<div style="color:var(--mut);font-size:.85rem">Dépôt de fichiers indisponible dans cette vue.</div>'}
  <div class="acts"><button data-a="close">Annuler</button><button class="pri" data-a="saveP">Enregistrer</button></div>`);
  fileList();
  const up=$('#f-up');if(up)up.onchange=async()=>{for(const f of up.files){try{toast('Envoi de '+f.name+'…');const r=await assets.upload(f);cur.files.push({name:f.name,id:r.id,type:r.contentType||f.type});fileList()}catch(e){upErr(e)}}up.value=''}
}
function readP(){cur.title=$('#f-title').value.trim()||'Sans titre';cur.year=$('#f-year').value.trim();cur.desc=$('#f-desc').value.trim();cur.tags=$('#f-tags').value.split(',').map(s=>s.trim()).filter(Boolean);cur.links=$('#f-links').value.split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{const i=l.lastIndexOf('|');return i<0?{label:'',url:l}:{label:l.slice(0,i).trim(),url:l.slice(i+1).trim()}})}
function openProfile(){const p=S.profile;modal(`<h2>Mon profil</h2><label>Nom</label><input id="p-name" value="${esc(p.name)}"><label>Titre / formation</label><input id="p-title" value="${esc(p.title)}"><label>Présentation</label><textarea id="p-bio">${esc(p.bio)}</textarea><label>E-mail</label><input id="p-email" value="${esc(p.email)}"><label>LinkedIn (URL)</label><input id="p-li" value="${esc(p.linkedin)}"><label>GitHub (URL)</label><input id="p-gh" value="${esc(p.github)}"><div class="acts"><button data-a="close">Annuler</button><button class="pri" data-a="saveProf">Enregistrer</button></div>`)}
function qrSvg(u){const q=qrcode(0,'M');q.addData(u);q.make();return q.createSvgTag(6,4)}
function openQR(){
  modal(`<h2>Lien &amp; QR code pour votre CV</h2><p style="font-size:.9rem;color:var(--mut);margin-top:0">1) Partagez ce portfolio avec un <b>lien public</b> via le menu de partage de Claude. 2) Collez ici le lien obtenu : le QR code est généré automatiquement.</p>
  <label>Lien public du portfolio</label><input id="q-url" placeholder="https://claude.ai/…" value="${esc(S.shareUrl)}"><div id="q-box"></div>
  <div class="acts"><button data-a="close">Fermer</button><button data-a="qrpng">Télécharger le QR (PNG)</button><button class="pri" data-a="saveQ">Enregistrer le lien</button></div>`);
  const draw=()=>{const u=$('#q-url').value.trim();$('#q-box').innerHTML=okUrl(u)?`<div class="qr">${qrSvg(u)}</div>`:''};
  $('#q-url').oninput=draw;draw();
}
async function qrPng(){
  const u=$('#q-url').value.trim();if(!okUrl(u))return toast('Collez d’abord un lien valide.');
  if(!dl)return toast('Téléchargement indisponible : faites une capture du QR code.');
  const img=new Image();img.onload=async()=>{const c=document.createElement('canvas');c.width=c.height=800;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,800,800);g.imageSmoothingEnabled=false;g.drawImage(img,0,0,800,800);
  c.toBlob(async b=>{try{await dl.save({filename:'qr-portfolio.png',data:b})}catch(e){if(!e||e.code!=='declined')toast('Téléchargement impossible.')}},'image/png')};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(qrSvg(u));
}
function pickCv(){if(!assets)return toast('Dépôt indisponible dans cette vue.');const i=document.createElement('input');i.type='file';i.accept='.pdf,application/pdf';i.onchange=async()=>{const f=i.files[0];if(!f)return;try{toast('Envoi du CV…');const r=await assets.upload(f);S.cv={name:f.name,id:r.id,type:r.contentType||f.type};await save()}catch(e){toast('Échec (PDF uniquement) : '+(e&&e.message||e))}};i.click()}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=b.dataset.id;
  if(a==='new')openProject();else if(a==='edit')openProject(id);else if(a==='profile')openProfile();else if(a==='qr')openQR();else if(a==='cv')pickCv();else if(a==='map')openMap();else if(a==='editmap')openMap(id);
  else if(a==='delmap'){if(confirm('Supprimer cette carte ?')){S.maps=S.maps.filter(m=>m.id!==id);await save();render()}}
  else if(a==='saveM'){if(!curM.file)return toast('Ajoutez d’abord le fichier de la carte.');curM.title=$('#m-title').value.trim()||'Carte sans titre';curM.desc=$('#m-desc').value.trim();const i=S.maps.findIndex(m=>m.id===curM.id);if(i<0)S.maps.unshift(curM);else S.maps[i]=curM;closeM();await save();render()}
  else if(a==='zoom')openZoom(id);else if(a==='rmcv'){S.cv=null;await save()}
  else if(a==='close')closeM();
  else if(a==='del'){if(confirm('Supprimer ce projet ?')){S.projects=S.projects.filter(p=>p.id!==id);await save();render()}}
  else if(a==='rmf'){cur.files.splice(+b.dataset.i,1);fileList()}
  else if(a==='saveP'){readP();const i=S.projects.findIndex(p=>p.id===cur.id);if(i<0)S.projects.unshift(cur);else S.projects[i]=cur;closeM();await save();render()}
  else if(a==='saveProf'){Object.assign(S.profile,{name:$('#p-name').value.trim(),title:$('#p-title').value.trim(),bio:$('#p-bio').value.trim(),email:$('#p-email').value.trim(),linkedin:$('#p-li').value.trim(),github:$('#p-gh').value.trim()});closeM();await save();render()}
  else if(a==='saveQ'){S.shareUrl=$('#q-url').value.trim();closeM();await save();render()}
  else if(a==='qrpng')qrPng();
});
render();
(async()=>{if(!window.claude)return;try{const u=await claude.use('user');canEdit=!!(u&&u.canEdit());artifact=await claude.use('artifact');assets=await claude.use('assets');dl=await claude.use('downloads');if(!artifact)canEdit=false;render()}catch(e){}})();
</script>
